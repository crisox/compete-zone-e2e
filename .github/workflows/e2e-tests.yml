name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: competezone_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5434:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: compete-zone-e2e/package-lock.json

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install dependencies
      run: |
        cd compete-zone-e2e
        npm ci

    - name: Install Playwright browsers
      run: |
        cd compete-zone-e2e
        npx playwright install --with-deps

    - name: Build backend
      run: |
        cd compete-zone-api
        ./mvnw clean compile -DskipTests

    - name: Start services
      run: |
        cd compete-zone-e2e
        docker-compose -f docker-compose.e2e.yml up -d
        npm run wait:services

    - name: Seed test data
      run: |
        cd compete-zone-e2e
        npm run seed:data

    - name: Run E2E tests
      run: |
        cd compete-zone-e2e
        npm run test:ci
      env:
        CI: true
        API_URL: http://localhost:8081
        FRONTEND_URL: http://localhost:5174
        DB_HOST: localhost
        DB_PORT: 5434
        DB_NAME: competezone_e2e
        DB_USER: postgres
        DB_PASSWORD: postgres

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: compete-zone-e2e/reports/
        retention-days: 30

    - name: Upload screenshots
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-screenshots
        path: compete-zone-e2e/reports/screenshots/
        retention-days: 30

    - name: Upload videos
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-videos
        path: compete-zone-e2e/reports/videos/
        retention-days: 30

    - name: Cleanup services
      if: always()
      run: |
        cd compete-zone-e2e
        docker-compose -f docker-compose.e2e.yml down -v
